name: build-natives

# 三平台原生物理库构建 + JNI 冒烟测试。
# 本地只验证过 Windows；Linux/macOS 由本工作流产出并自动测试。
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-natives.yml'

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            key: windows_amd64
            target: x86_64-pc-windows-msvc
            lib: polymech_physics.dll
          - os: ubuntu-22.04
            key: linux_amd64
            target: x86_64-unknown-linux-gnu
            lib: libpolymech_physics.so
          - os: macos-14
            key: macos_aarch64
            target: aarch64-apple-darwin
            lib: libpolymech_physics.dylib
          - os: macos-13
            key: macos_amd64
            target: x86_64-apple-darwin
            lib: libpolymech_physics.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure linker paths for JNI (jvm.lib / libjvm.so)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "RUSTFLAGS=-L native=${JAVA_HOME}/lib" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "RUSTFLAGS=-L native=${JAVA_HOME}/lib/server" >> "$GITHUB_ENV"
          else
            echo "RUSTFLAGS=-L native=${JAVA_HOME}/lib/server" >> "$GITHUB_ENV"
          fi

      - name: Build native library
        working-directory: native/polymech-physics
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compile Java bindings + smoke test
        shell: bash
        run: |
          mkdir -p build-ci
          javac -d build-ci \
            src/main/java/com/mss/polymech/physics/NativePhysics.java \
            native/jni-smoketest/NativeSmokeTest.java

      - name: Run JNI smoke test
        shell: bash
        run: |
          LIB="native/polymech-physics/target/${{ matrix.target }}/release/${{ matrix.lib }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            java -cp build-ci NativeSmokeTest "$(cygpath -w "$PWD/$LIB")"
          else
            java -cp build-ci NativeSmokeTest "$PWD/$LIB"
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.key }}
          path: native/polymech-physics/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

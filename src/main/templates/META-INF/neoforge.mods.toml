# Poly Mech — NeoForge mod metadata
# Minecraft 1.21.1 · NeoForge 21.1.228 · JDK 21
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

# A list of mods
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
credits="MSS Team"
description='''
Poly Mech is a Minecraft 1.21.1 NeoForge tech mod centered on realistic physics, orbital mechanics, and industrial automation.

Key features:
- 6DOF space physics with seamless Earth↔space transitions
- Kelvin orbital mechanics: real-time N-body simulation of stars, planets, black holes, and meteoroids
- 17+ multi-block production machines (coke oven, blast furnace, steam hammer, roller crusher, jig, filling unit, reverberatory furnace, turbines) and 3 steam boiler variants
- World-wide fluid pipe network (4 diameters) and 3-way conveyor belt transport
- World-wide power grid with voltage tiers, wire connections, and FE adaptation
- CDK-driven chemical fluid system with SMILES parsing, structural formula rendering, and composition pie charts
- Client-side blueprint system with input handling and HUD overlay
- Rapier f64 native physics engine for rigid body collision and physgun interaction
- Custom ore vein and rock layer world generation (26 minerals)
- Material set system: pipes, conveyors, and ingots share texture templates driven by JSON color config
- Built-in Chinese (zh_cn) and English (en_us) localization
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Dependencies
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# LDLib2 — required for machine framework (registerCapabilities, MachineRegistry, multi-block IO)
# 注意：模组 id 是 ldlib2，不是 ldlib（写错会导致依赖解析失败、游戏起不来）
[[dependencies.${mod_id}]]
    modId="ldlib2"
    type="required"
    versionRange="[${ldlib2_version},)"
    ordering="NONE"
    side="BOTH"

# GeckoLib — required for geo-model machine rendering
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"
